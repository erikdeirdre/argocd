---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: percona-xtradb-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"  # After operator
spec:
  project: default
  
  source:
    repoURL: https://percona.github.io/percona-helm-charts/
    chart: pxc-db
    targetRevision: 1.18.0
    
    helm:
      skipCrds: false
      values: |
        # Cluster configuration
        finalizers:
          - delete-pxc-pods-in-order
        
        pxc:
          size: 3  # 3-node cluster for HA, use 1 for dev
          image:
            repository: percona/percona-xtradb-cluster
            tag: 8.0.36-28.1

          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 1000m
        
          persistence:
            enabled: true
            storageClass: nfs-client
            size: 10Gi
          
          # Expose service
          expose:
            enabled: true
            type: ClusterIP  # or LoadBalancer
        
          # HAProxy for load balancing
          haproxy:
            enabled: true
            size: 3  # Use 3 for HA
            resources:
              requests:
                memory: 256Mi
                cpu: 100m

          #podAnnotations:
          #  prometheus.io/scrape: "true"
          #  prometheus.io/port: "8404"
          #  prometheus.io/path: "/stats/prometheus"
        
        # ProxySQL (alternative to HAProxy)
          proxysql:
            enabled: false

          #podAnnotations:
          #  prometheus.io/scrape: "true"
          #  prometheus.io/port: "9104"
          #  prometheus.io/path: "/metrics"

          # Add mysqld_exporter sidecar for MySQL metrics
          #sidecars:
          #- name: mysqld-exporter
          #  image: prom/mysqld-exporter:v0.15.1
          #  ports:
          #  - containerPort: 9104
          #    name: metrics
          #    protocol: TCP
          #  env:
          #  - name: DATA_SOURCE_NAME
          #    value: "monitor:$(MONITOR_PASSWORD)@(localhost:3306)/"
          #  - name: MONITOR_PASSWORD
          #    valueFrom:
          #      secretKeyRef:
          #        name: my-cluster-secrets
          #        key: monitor        
          # Backups (optional)
          backup:
            enabled: false
            # Uncomment and configure for backups
            # image:
            #   repository: percona/percona-xtradb-cluster-operator
            #   tag: 1.15.0-pxc8.0-backup
            # storages:
            #   s3-us-west:
            #     type: s3
            #     s3:
            #       bucket: my-backup-bucket
            #       region: us-west-2
        
          # Secrets (will be auto-generated if not provided)
          secrets:
            passwords:
              root: ""  # Leave empty to auto-generate
              xtrabackup: ""
              monitor: ""
              clustercheck: ""
              proxyadmin: ""
              operator: ""
        
  destination:
    server: https://kubernetes.default.svc
    namespace: mysql  # or your preferred namespace
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
