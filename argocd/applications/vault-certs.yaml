apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-certs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"  # Create before Vault
spec:
  project: default
  source:
    repoURL: https://github.com/CoastalYouthSoccer/helm-charts.git
    targetRevision: main
    path: templates/vault
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
