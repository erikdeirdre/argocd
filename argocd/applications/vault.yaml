# argocd/applications/vault.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"  # Install early
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.31.0
    helm:
      values: |
        global:
          enabled: true
          tlsDisable: false
        server:
          extraEnvironmentVars:
            VAULT_CACERT: /vault/userconfig/vault-ha-tls/ca.crt
            VAULT_TLSCERT: /vault/userconfig/vault-ha-tls/tls.crt
            VAULT_TLSKEY: /vault/userconfig/vault-ha-tls/tls.key
          volumes:
            - name: userconfig-vault-ha-tls
              secret:
                defaultMode: 420
                secretName: vault-ha-tls
            - name: userconfig-vault-raft-client
              secret:
                defaultMode: 420
                secretName: vault-raft-client
          volumeMounts:
            - mountPath: /vault/userconfig/vault-ha-tls
              name: userconfig-vault-ha-tls
              readOnly: true
            - mountPath: /vault/userconfig/vault-raft-client
              name: userconfig-vault-raft-client
              readOnly: true
          standalone:
            enabled: false
          
          # HA mode (recommended for production)
          ha:
            enabled: true
            replicas: 2
            raft:
              enabled: true
              setNodeId: true
              config: |
                cluster_name = "vault-integrated-storage"
                api_addr = "https://$(POD_NAME).vault-internal:8200"
                cluster_addr = "https://$(POD_NAME).vault-internal:8201"
                ui = true
                listener "tcp" {
                  tls_disable = 0
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_cert_file = "/vault/userconfig/vault-ha-tls/tls.crt"
                  tls_key_file  = "/vault/userconfig/vault-ha-tls/tls.key"
                  tls_client_ca_file = "/vault/userconfig/vault-ha-tls/ca.crt"
                  tls_require_and_verify_client_cert = false
                }

                storage "raft" {
                  path = "/vault/data"
                }

                service_registration "kubernetes" {}
          
          # Resources
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          
          # Ingress
          ingress:
            enabled: false
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/service.serversscheme: https
              traefik.ingress.kubernetes.io/router.middlewares: vault-vault-server-headers@kubernetescrd,vault-vault-redirect-ui@kubernetescrd
              traefik.ingress.kubernetes.io/service.serverstransport: vault-vault-transport@kubernetescrd  # Use the transport
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
              cert-manager.io/cluster-issuer: selfsigned-issuer
            hosts:
              - host: vault.example.com
                paths:
                  - /
            tls:
              - secretName: vault-ui-tls
                hosts:
                  - vault.example.com
          
          # Data storage
          dataStorage:
            enabled: true
            size: 10Gi
            storageClass: nfs-client
          
          # Audit storage
          auditStorage:
            enabled: true
            size: 10Gi
            storageClass: nfs-client
        
        ui:
          enabled: true
          serviceType: ClusterIP
        
        injector:
          enabled: false

        csi:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
